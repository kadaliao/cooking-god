<!doctype html>
<!-- 小工具发布用的图标（1:1）和封面（3:4）。用 scripts/minitool/render-store-art.mjs 渲染。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'ZCOOL KuaiLe'; src: url('../fonts/zcool-kuaile-subset.woff2') format('woff2'); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #000; }
  .logo { font-family: 'ZCOOL KuaiLe', sans-serif; color: #fff3c4; -webkit-text-stroke: 10px #3b2416; paint-order: stroke fill; text-shadow: 0 14px 0 #3b2416; letter-spacing: 10px; }

  #icon { width: 1024px; height: 1024px; position: relative; overflow: hidden;
    background: radial-gradient(circle at 50% 38%, #ffe2a8 0%, #ffb15c 45%, #e8582f 100%); }
  #icon .rays { position: absolute; inset: -30%; background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,255,255,.16) 0 10deg, transparent 10deg 22deg); }
  #icon img { position: absolute; left: 50%; top: 52%; width: 860px; transform: translate(-50%, -50%); filter: drop-shadow(0 24px 0 rgba(59,36,22,.35)); }

  #cover { width: 1080px; height: 1440px; position: relative; overflow: hidden; background: #2b1a12 url('../../public/art/scene/kitchen.webp') center / cover; }
  #cover::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 38%, rgba(255,190,110,.35), rgba(43,26,18,.82) 75%); }
  #cover > * { position: absolute; }
  #cover .mascot { left: 50%; top: 70px; width: 600px; transform: translateX(-50%); filter: drop-shadow(0 20px 0 rgba(59,36,22,.4)); }
  #cover .logo { left: 0; right: 0; top: 650px; text-align: center; font-size: 190px; line-height: 1; }
  #cover .sub { left: 0; right: 0; top: 880px; text-align: center; font-family: 'ZCOOL KuaiLe', sans-serif; font-size: 50px; color: #fff6e5; text-shadow: 0 4px 0 #3b2416; letter-spacing: 4px; }
  #cover .cards { left: 0; right: 0; top: 1000px; height: 300px; display: flex; justify-content: center; }
  .card { width: 168px; height: 232px; margin: 0 -6px; background: linear-gradient(180deg, #fffdf7, #ffeccc); border: 6px solid #3b2416; border-radius: 24px; box-shadow: 0 8px 0 #3b2416; display: flex; flex-direction: column; align-items: center; padding-top: 18px; }
  .card img { width: 120px; height: 120px; object-fit: contain; }
  .card b { font-family: 'ZCOOL KuaiLe', sans-serif; font-size: 34px; color: #3b2416; margin-top: 8px; font-weight: 400; }
  .card:nth-child(1) { transform: rotate(-12deg) translateY(30px); }
  .card:nth-child(2) { transform: rotate(-5deg) translateY(6px); }
  .card:nth-child(4) { transform: rotate(5deg) translateY(6px); }
  .card:nth-child(5) { transform: rotate(12deg) translateY(30px); }
  .arrow { font-size: 40px; }
  #cover .score { right: 60px; top: 960px; font-family: 'ZCOOL KuaiLe', sans-serif; font-size: 92px; color: #ffd166; -webkit-text-stroke: 8px #3b2416; paint-order: stroke fill; transform: rotate(-8deg); text-shadow: 0 8px 0 #3b2416; }
  #cover .foot { left: 0; right: 0; bottom: 56px; text-align: center; font-family: 'ZCOOL KuaiLe', sans-serif; font-size: 40px; color: #ffe9c7; text-shadow: 0 3px 0 #3b2416; }
</style>
</head>
<body>
  <div id="icon"><div class="rays"></div><img src="../../public/art/scene/mascot.webp" alt=""></div>
  <div id="cover">
    <img class="mascot" src="../../public/art/scene/mascot.webp" alt="">
    <div class="logo">料理之神</div>
    <div class="sub">抽食材 · 排顺序 · 连锁乘算</div>
    <div class="cards">
      <div class="card"><img src="../../public/art/ingredients/garlic.webp" alt=""><b>大蒜</b></div>
      <div class="card"><img src="../../public/art/ingredients/beef.webp" alt=""><b>牛肉</b></div>
      <div class="card"><img src="../../public/art/ingredients/chili.webp" alt=""><b>辣椒</b></div>
      <div class="card"><img src="../../public/art/ingredients/pork.webp" alt=""><b>猪肉</b></div>
      <div class="card"><img src="../../public/art/ingredients/shrimp.webp" alt=""><b>虾</b></div>
    </div>
    <div class="score">×2!</div>
    <div class="foot">一锅炒出几百万分 · 9 关挑战料理之神</div>
  </div>
</body>
</html>
